name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate localization resources
        shell: pwsh
        run: ./scripts/Validate-LocalizationResources.ps1

      - name: Restore dependencies
        run: |
          dotnet restore src/NetSonar.Desktop/NetSonar.Desktop.csproj
          dotnet restore tests/NetSonar.Tests/NetSonar.Tests.csproj

      - name: Build application
        run: dotnet build src/NetSonar.Desktop/NetSonar.Desktop.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/NetSonar.Tests/NetSonar.Tests.csproj --configuration Release --no-restore
